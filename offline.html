<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Sem conexão</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            text-align: center;
        }

        .caixa {
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border: 1px solid #333;
            border-radius: 18px;
            background: #111;
        }

        .icone {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: #aaa;
            line-height: 1.5;
        }

    </style>

</head>


<body>

    <div class="caixa">

        <div class="icone">
            📡
        </div>

        <h1>
            Sem conexão
        </h1>

        <p>
            Você está sem internet no momento.
            Tente novamente quando a conexão voltar.
        </p>

    </div>

</body>

</html>
